version: '3.7'
services:

  postgres:
    image: "postgres:14-alpine@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310"
    volumes:
      - "meldekortservice:/var/lib/postgresql/data"
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: "meldekortservice-local"
      POSTGRES_PASSWORD: "testpassword"
      POSTGRES_DB: "meldekortservice-local"

volumes:
  meldekortservice:
